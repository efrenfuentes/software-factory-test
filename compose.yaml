# Local PostgreSQL for development, matching config/database.example.toml.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: software_factory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d software_factory"]
      interval: 2s
      timeout: 5s
      retries: 15
